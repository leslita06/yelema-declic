<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Le Déclic, par Yelema</title>
<meta name="description" content="En trois minutes, voyez où votre entreprise perd du temps et quel Expert IA le reprend.">
<link rel="icon" href="assets/logo/yelema-icon.png">
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url('assets/fonts/SpaceGrotesk-Variable.woff2') format('woff2')}
@font-face{font-family:'Funnel Display';font-weight:300 800;font-display:swap;src:url('assets/fonts/FunnelDisplay-Variable.woff2') format('woff2')}
:root{
  --indigo:#301667;--indigo2:#1C0F3D;--violet:#8D68FA;--violet-deep:#4A299C;--lav:#C5C4FF;--lavp:#E0E1FF;
  --lilac:#F3EFFE;--lilac2:#EFE9FF;--bleu:#2E4EC4;--corail:#E4765A;--corailp:#FBE7E2;--ink:#241A3A;--muted:#6B6580;--grey2:#938DA8;--line:#ECE8FA;
  --card-dark:#3D227E;--border-dark:#4E3096;--green:#22A45D;
  --grad:linear-gradient(135deg,#2E4EC4,#8D68FA);
  --hero:linear-gradient(160deg,#FFFFFF 0%,#F3EFFE 50%,#E0E1FF 100%);--vif:linear-gradient(135deg,#2E4EC4 0%,#6F4BDF 55%,#8D68FA 100%);
  --sh:0 16px 40px rgba(48,22,103,.10);--sh2:0 24px 60px rgba(48,22,103,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Funnel Display',system-ui,sans-serif;color:var(--ink);background:#F7F5FE;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,.sg{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
.ic{display:inline-block;width:22px;height:22px;flex:0 0 auto}
.ic svg{width:100%;height:100%;display:block}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.eyebrow{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}

/* Barre du haut */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);color:var(--indigo);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:16px;height:64px}
.top img.logo{height:26px}
.prog{flex:1;height:8px;border-radius:999px;background:var(--lilac2);overflow:hidden;max-width:420px;margin-left:auto}
.prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mini{width:34px;height:34px}
.mini rect{transition:fill .4s}

/* Écrans */
.screen{display:none;padding:40px 0 60px;min-height:calc(100vh - 64px)}
.screen.on{display:block;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.q-ic{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(141,104,250,.35)}
.q-ic .ic{width:26px;height:26px}
.screen h2{font-size:32px;color:var(--indigo);margin:14px 0 6px;line-height:1.1}
.lede{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:640px}

/* Accueil */
.hero{background:var(--hero);color:var(--indigo);border-bottom:1px solid var(--line);border-radius:0 0 40px 40px;padding:40px 0 70px;position:relative;overflow:hidden}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:52px;line-height:1.02;margin:12px 0 16px}
.hero h1 em{font-style:normal;color:var(--corail)}
.hero p{color:#4A4560;font-size:19px;margin:0 0 28px}
.perks{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px}
.perks > span{display:flex;align-items:center;gap:8px;color:var(--indigo);font-weight:500;font-size:15px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(48,22,103,.06);padding:8px 14px;border-radius:999px}
.perks .ic{width:18px;height:18px;color:var(--violet)}
.bloom{width:100%;max-width:380px;justify-self:center;filter:drop-shadow(0 24px 40px rgba(74,41,156,.28))}
.bloom .p{transform-origin:240px 240px;transform:scale(0) rotate(-60deg);animation:open 1.1s cubic-bezier(.2,.9,.25,1.2) forwards}
@keyframes open{to{transform:scale(1) rotate(0)}}
.bloom .core{transform-origin:240px 240px;animation:pulse 3s ease-in-out 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.bloom .spin{transform-origin:240px 240px;animation:spin 40s linear 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.floaty{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;color:var(--indigo);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:600;border:1px solid var(--line);box-shadow:var(--sh2);animation:float 5s ease-in-out infinite}
.floaty img{width:30px;height:30px;border-radius:999px;object-fit:cover}
@keyframes float{50%{transform:translateY(-10px)}}

/* Cartes à cliquer */
.cards{display:grid;gap:14px}
.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;box-shadow:0 2px 0 rgba(48,22,103,.04)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#D9CCFD}
.card:active{transform:scale(.98)}
.card .chip{width:46px;height:46px;border-radius:14px;background:var(--lavp);color:var(--violet);display:grid;place-items:center;transition:all .2s}
.card .t{font-family:'Space Grotesk';font-weight:500;color:var(--indigo);line-height:1.2}
.card .s{font-size:13px;color:var(--muted)}
.card .tick{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:999px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;transition:all .2s;transform:scale(.9)}
.card .tick .ic{width:15px;height:15px}
.card.sel{border-color:var(--violet);background:linear-gradient(180deg,#fff,var(--lilac));box-shadow:0 14px 34px rgba(141,104,250,.22)}
.card.sel .chip{background:var(--grad);color:#fff}
.card.sel .tick{background:var(--violet);border-color:var(--violet);transform:scale(1);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.card .face{display:flex;align-items:center;gap:10px}
.card .face img{width:46px;height:46px;border-radius:999px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(30,16,80,.18)}
.card .face .chip{width:34px;height:34px;border-radius:11px;margin-left:-18px;margin-top:22px;border:2px solid #fff}
.card .face .chip .ic{width:17px;height:17px}

/* Formulaire */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;transition:border-color .18s,box-shadow .18s}
.fld:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(141,104,250,.15)}
.fld .ic{color:var(--violet)}
.fld label{flex:1;font-size:12px;font-weight:600;color:var(--grey2);text-transform:uppercase;letter-spacing:.08em}
.fld input{display:block;width:100%;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:none;padding:4px 0 0;text-transform:none;letter-spacing:0;font-weight:400}

/* Tâches */
.task{background:#fff;border:1.5px solid var(--line);border-radius:20px;margin-bottom:12px;transition:all .2s;overflow:hidden}
.task.sel{border-color:var(--violet);box-shadow:0 14px 34px rgba(141,104,250,.18)}
.task-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:16px 18px;text-align:left}
.task-row .box{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid #D3CBF3;display:grid;place-items:center;color:#fff;transition:all .2s}
.task-row .box .ic{width:15px;height:15px}
.task.sel .box{background:var(--violet);border-color:var(--violet)}
.task-row span.l{font-weight:500;color:var(--indigo);font-size:16px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px;max-height:0;opacity:0;transition:all .3s}
.task.sel .hours{max-height:260px;opacity:1;padding:0 18px 16px}
.hours .lab{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hours .lab .ic{width:15px;height:15px;color:var(--corail)}
.hb{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:15px;font-weight:600;color:var(--indigo);text-align:center;transition:all .15s}
.hb b{display:block;font-family:'Space Grotesk';font-size:18px;color:var(--indigo)}
.hb:hover{border-color:var(--violet)}
.hb.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.hb.on b{color:#fff}
.tools{margin-top:22px;background:#fff;border-radius:20px;padding:18px;border:1.5px dashed #D9CCFD}
.tools p{margin:0 0 12px;font-weight:600;color:var(--indigo);display:flex;gap:8px;align-items:center}
.tools p .ic{color:var(--violet)}
.logos{display:flex;flex-wrap:wrap;gap:10px}
.logo-b{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;transition:all .15s}
.logo-b img{width:24px;height:24px;object-fit:contain}
.logo-b.on{border-color:var(--violet);background:var(--lilac);box-shadow:0 6px 16px rgba(141,104,250,.2)}
.exp-pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--sh);margin-bottom:18px}
.exp-pill img{width:40px;height:40px;border-radius:999px;object-fit:cover}
.exp-pill span{font-size:14px;color:var(--muted)}
.exp-pill b{color:var(--indigo)}

/* Maturité */
.mq{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;border:1.5px solid var(--line)}
.mq h3{display:flex;align-items:center;gap:12px;margin:0 0 14px;color:var(--indigo);font-size:19px}
.mq h3 .chip{width:40px;height:40px;border-radius:12px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sc{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 10px;font-size:14px;text-align:left;transition:all .15s;position:relative}
.sc .dots{display:flex;gap:3px;margin-bottom:8px}
.sc .dots i{width:14px;height:5px;border-radius:999px;background:var(--line)}
.sc .dots i.f{background:var(--violet)}
.sc:hover{border-color:var(--violet)}
.sc.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.sc.on .dots i{background:rgba(255,255,255,.25)}.sc.on .dots i.f{background:#fff}

/* Navigation */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
.btn{border:0;border-radius:999px;padding:15px 28px;font-weight:600;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .18s,box-shadow .18s,opacity .2s}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(141,104,250,.4)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(141,104,250,.5)}
.btn-p:disabled{opacity:.45;transform:none;box-shadow:none;cursor:not-allowed}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--indigo)}
.btn-g:hover{border-color:var(--violet);color:var(--violet)}
.btn-w{background:#fff;color:var(--indigo);box-shadow:0 10px 26px rgba(0,0,0,.25)}
.btn-big{padding:18px 34px;font-size:18px}
.err{color:var(--corail);font-size:14px;min-height:20px;margin-top:12px;font-weight:500}

/* Analyse */
.analyse{text-align:center;padding-top:80px}
.analyse svg{width:200px;height:200px;animation:spin 1.6s cubic-bezier(.5,.1,.5,.9) infinite}
.analyse h2{margin-top:30px}
.steps-a{list-style:none;padding:0;margin:20px auto 0;max-width:360px;text-align:left}
.steps-a li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);opacity:.35;transition:opacity .3s}
.steps-a li.on{opacity:1;color:var(--indigo)}
.steps-a .ic{width:20px;height:20px;color:var(--green)}

/* Résultat */
.r-hero{background:var(--hero);color:var(--indigo);border:1px solid var(--line);border-radius:32px;padding:30px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.r-hero::after{content:"";position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;background:url('assets/site-pattern-3.svg') no-repeat center/contain;opacity:.1}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:'Space Grotesk';font-size:56px;line-height:1;display:block}
.ring .v small{color:var(--muted);font-size:14px}
.r-hero h2{color:var(--indigo);font-size:34px;margin:6px 0 10px}
.r-hero .lvl{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--indigo)}
.r-hero .lvl .ic{width:18px;height:18px;color:var(--corail)}
.r-hero p{color:#4A4560;margin:12px 0 0;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 8px}
.kpi{background:#fff;border-radius:22px;padding:20px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--sh)}
.kpi .chip{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--grad);flex:0 0 auto}
.kpi.k1 .chip{background:linear-gradient(135deg,#E4765A,#F0A08A)}
.kpi b{font-family:'Space Grotesk';font-size:40px;line-height:1;color:var(--indigo);display:block}
.kpi b small{font-size:16px;margin-left:3px}
.kpi div > span{font-size:14px;color:var(--muted)}
.sec-t{font-size:24px;color:var(--indigo);margin:40px 0 6px}
.sec-l{color:var(--muted);margin:0 0 16px}
.bars{background:#fff;border-radius:22px;padding:22px;box-shadow:var(--sh);display:grid;gap:14px}
.barrow{display:grid;grid-template-columns:36px 180px 1fr 64px;gap:12px;align-items:center;font-size:15px}
.barrow .chip{width:36px;height:36px;border-radius:11px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.barrow .chip .ic{width:18px;height:18px}
.track{height:16px;background:var(--lilac);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--grad);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.barrow b{font-family:'Space Grotesk';color:var(--indigo);text-align:right}
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pain{background:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);position:relative;overflow:hidden}
.pain::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--grad)}
.pain .rk{display:flex;justify-content:space-between;align-items:center}
.pain .rk span{font-family:'Space Grotesk';font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--violet)}
.pain .rk .chip{width:40px;height:40px;border-radius:12px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.pain h4{margin:0;color:var(--indigo);font-size:18px;line-height:1.25;font-weight:500}
.pain .h{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--corail);font-weight:600;background:var(--corailp);padding:4px 10px;border-radius:999px;align-self:flex-start}
.pain .h .ic{width:15px;height:15px}
.pain p{margin:0;color:var(--muted);font-size:15px}
.pain .who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pain .who img{width:36px;height:36px;border-radius:999px;object-fit:cover}
.experts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.xcard{border-radius:24px;padding:22px;background:var(--vif);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh2);transition:transform .2s}
.xcard:hover{transform:translateY(-4px)}
.xcard:nth-child(2){background:linear-gradient(135deg,#6F4BDF,#A486FB)}.xcard:nth-child(3){background:linear-gradient(135deg,#E4765A,#F0A08A)}
.xcard .top-x{display:flex;justify-content:space-between;align-items:flex-start}
.xcard img{width:72px;height:72px;border-radius:999px;object-fit:cover;border:3px solid rgba(255,255,255,.75)}
.match{width:64px;height:64px;position:relative}
.match svg{width:100%;height:100%;transform:rotate(-90deg)}
.match b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Space Grotesk';font-size:16px}
.xcard h4{margin:14px 0 2px;font-size:22px}
.xcard .m{color:rgba(255,255,255,.85);font-size:14px}
.xcard:nth-child(3) .m{color:#fff}
.xcard ul{list-style:none;margin:14px 0 0;padding:0;font-size:14px;display:grid;gap:6px}
.xcard li{display:flex;gap:8px;align-items:flex-start}
.xcard li .ic{width:16px;height:16px;margin-top:2px;color:#fff}
.xcard .gain{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;display:flex;gap:8px;align-items:center}
.xcard .gain .ic{width:16px;height:16px}
.offer{margin-top:36px;border-radius:32px;background:var(--vif);color:#fff;padding:32px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.offer h3{margin:8px 0 10px;font-size:30px}
.offer p{color:rgba(255,255,255,.9);margin:0}
.offer .cta{display:flex;flex-direction:column;gap:12px;align-items:flex-start;position:relative;z-index:1}
.stack{display:flex;margin-bottom:6px}
.stack img{width:48px;height:48px;border-radius:999px;object-fit:cover;border:3px solid #fff;margin-left:-12px}
.stack img:first-child{margin-left:0}
.note{font-size:13px;color:var(--grey2);margin-top:18px}
footer{padding:22px 0 30px;color:var(--grey2);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

@media (max-width:860px){
  .hero .in{grid-template-columns:1fr}.bloom{max-width:240px;order:-1}
  .c4{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(2,1fr)}
  .kpis,.pains,.experts{grid-template-columns:1fr}
  .offer,.r-hero{grid-template-columns:1fr}.ring{margin:0 auto}
  .barrow{grid-template-columns:32px 1fr 56px}.barrow .track{grid-column:2/4;grid-row:2}
  .scale{grid-template-columns:repeat(2,1fr)}
  .floaty{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 16px}.form{grid-template-columns:1fr}
  .hero h1{font-size:36px}.screen h2{font-size:26px}
  .hours{grid-template-columns:repeat(2,1fr)}
  .top img.logo{height:22px}
  .nav .btn{padding:14px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bloom .p{transform:none}}
/* v4 : barre du haut lisible, classement, champs libres, encarts d'analyse */
.top .in{height:68px}
.prog-w{flex:1;max-width:460px;margin-left:auto;display:flex;flex-direction:column;gap:6px}
.prog-w .stepn{font-family:'Space Grotesk';font-size:12px;font-weight:600;color:var(--violet-deep);letter-spacing:.06em;text-transform:uppercase;text-align:right}
.prog{height:10px;max-width:none;margin:0;background:#E6E1FA;box-shadow:inset 0 1px 2px rgba(48,22,103,.12)}
.mini{width:42px;height:42px;filter:drop-shadow(0 3px 6px rgba(74,41,156,.25))}
.sel-f{display:block;width:100%;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:none;padding:4px 0 0;text-transform:none;letter-spacing:0;font-weight:400;appearance:none;cursor:pointer}
.fld.full{grid-column:1/-1}
.autre-in{margin-top:14px}
.hours{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.hours .lab{font-weight:600;color:var(--indigo)}
.task.manque{border-color:var(--corail);box-shadow:0 0 0 4px rgba(228,118,90,.18);animation:secoue .4s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.task-autre .task-row input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:var(--indigo);background:none;font-weight:500}
.rank{margin:22px 0 0;background:#fff;border-radius:20px;padding:18px;border:1.5px solid var(--line);box-shadow:var(--sh)}
.rank h3{margin:0 0 4px;font-size:18px;color:var(--indigo);display:flex;gap:10px;align-items:center}
.rank h3 .ic{color:var(--corail)}
.rank p{margin:0 0 12px;color:var(--muted);font-size:14px}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:flex;align-items:center;gap:12px;background:var(--lilac);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:grab;transition:transform .15s,box-shadow .15s}
.rank li.drag{opacity:.5}
.rank li.over{border-color:var(--violet);box-shadow:0 8px 20px rgba(141,104,250,.25)}
.rank li .n{flex:0 0 30px;height:30px;border-radius:999px;background:var(--grad);color:#fff;font-family:'Space Grotesk';font-weight:700;display:grid;place-items:center}
.rank li:nth-child(1) .n{background:linear-gradient(135deg,#E4765A,#F0A08A)}
.rank li .l{flex:1;font-weight:500;color:var(--indigo);font-size:15px}
.rank li .grip{color:var(--grey2)}
.rank li .mv{border:0;background:#fff;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;color:var(--violet);box-shadow:0 1px 3px rgba(48,22,103,.12)}
.rank li .mv:disabled{opacity:.3;cursor:default}
.rank li .mv .ic{width:18px;height:18px}
.add-tool{display:flex;gap:8px;margin-top:12px}
.add-tool input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;outline:0}
.add-tool input:focus{border-color:var(--violet)}
.add-tool button{border:0;border-radius:999px;background:var(--lavp);color:var(--violet-deep);padding:0 16px;font-weight:600;display:flex;align-items:center;gap:6px}
.add-tool .ic{width:16px;height:16px}
.logo-b .gen{width:24px;height:24px;border-radius:999px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.logo-b .gen .ic{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.levels{display:grid;gap:12px;margin-top:18px}
.lvl-r{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center}
.lvl-r .t{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--indigo)}
.lvl-r .t .chip{width:36px;height:36px;border-radius:11px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.lvl-r .t .chip .ic{width:18px;height:18px}
.lvl-r .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sub-h{font-family:'Space Grotesk';font-size:18px;color:var(--indigo);margin:28px 0 12px;display:flex;gap:10px;align-items:center}
.sub-h .ic{color:var(--violet)}
.txt{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px;transition:border-color .18s,box-shadow .18s}
.txt:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(141,104,250,.15)}
.txt label{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--indigo);margin-bottom:8px}
.txt label .ic{color:var(--violet)}
.txt textarea{width:100%;min-height:110px;border:0;outline:0;resize:vertical;font:inherit;font-size:16px;color:var(--ink);background:none}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.ins{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.ins .hd{display:flex;align-items:center;gap:12px}
.ins .hd .chip{width:44px;height:44px;border-radius:14px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.ins .hd b{font-family:'Space Grotesk';color:var(--indigo);font-size:17px}
.ins p{margin:0;color:#4A4560;font-size:15px}
.ins .tags{display:flex;flex-wrap:wrap;gap:6px}
.ins .tags span{background:var(--lilac);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--indigo)}
.meter{display:flex;gap:5px}.meter i{flex:1;height:8px;border-radius:999px;background:var(--lilac2)}.meter i.f{background:linear-gradient(90deg,#8D68FA,#E4765A)}
.quote{margin-top:18px;background:#fff;border-left:5px solid var(--violet);border-radius:18px;padding:18px 20px;box-shadow:var(--sh)}
.quote b{display:flex;gap:8px;align-items:center;color:var(--indigo);font-family:'Space Grotesk'}
.quote b .ic{color:var(--violet)}
.quote p{margin:8px 0 0;color:#4A4560;white-space:pre-line}
@media (max-width:860px){.insights{grid-template-columns:1fr}.lvl-r{grid-template-columns:1fr}}
@media (max-width:560px){
  .nav{position:sticky;bottom:0;z-index:10;background:rgba(247,245,254,.96);backdrop-filter:blur(8px);margin:24px -16px 0;padding:12px 16px;border-top:1px solid var(--line)}
  .prog-w .stepn{font-size:10px}.mini{width:34px;height:34px}
  .lvl-r .opts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1\" /> <path d=\"M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76\" /> <path d=\"M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6\" /> <path d=\"M12 10v4\" /> <path d=\"M12 2v3\" />", "shopping-basket": "<path d=\"m15 11-1 9\" /> <path d=\"m19 11-4-7\" /> <path d=\"M2 11h20\" /> <path d=\"m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4\" /> <path d=\"M4.5 15.5h15\" /> <path d=\"m5 11 4-7\" /> <path d=\"m9 11 1 9\" />", "sparkles": "<path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\" /> <path d=\"M20 3v4\" /> <path d=\"M22 5h-4\" /> <path d=\"M4 17v2\" /> <path d=\"M5 18H3\" />", "store": "<path d=\"m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7\" /> <path d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\" /> <path d=\"M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4\" /> <path d=\"M2 7h20\" /> <path d=\"M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7\" />", "target": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <circle cx=\"12\" cy=\"12\" r=\"6\" /> <circle cx=\"12\" cy=\"12\" r=\"2\" />", "timer": "<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\" /> <line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\" /> <circle cx=\"12\" cy=\"14\" r=\"8\" />", "trending-up": "<polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\" /> <polyline points=\"16 7 22 7 22 13\" />", "truck": "<path d=\"M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2\" /> <path d=\"M15 18H9\" /> <path d=\"M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14\" /> <circle cx=\"17\" cy=\"18\" r=\"2\" /> <circle cx=\"7\" cy=\"18\" r=\"2\" />", "user-search": "<circle cx=\"10\" cy=\"7\" r=\"4\" /> <path d=\"M10.3 15H7a4 4 0 0 0-4 4v2\" /> <circle cx=\"17\" cy=\"17\" r=\"3\" /> <path d=\"m21 21-1.9-1.9\" />", "user": "<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\" /> <circle cx=\"12\" cy=\"7\" r=\"4\" />", "users": "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" /> <circle cx=\"9\" cy=\"7\" r=\"4\" /> <path d=\"M22 21v-2a4 4 0 0 0-3-3.87\" /> <path d=\"M16 3.13a4 4 0 0 1 0 7.75\" />", "wallet": "<path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\" /> <path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\" />", "wheat": "<path d=\"M2 22 16 8\" /> <path d=\"M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\" /> <path d=\"M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\" /> <path d=\"M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z\" /> <path d=\"M20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4Z\" /> <path d=\"M11.47 17.47 13 19l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L5 19l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\" /> <path d=\"M15.47 13.47 17 15l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L9 15l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\" /> <path d=\"M19.47 9.47 21 11l-1.53 1.53a3.5 3.5 0 0 1-4.94 0L13 11l1.53-1.53a3.5 3.5 0 0 1 4.94 0Z\" />", "workflow": "<rect width=\"8\" height=\"8\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M7 11v4a2 2 0 0 0 2 2h4\" /> <rect width=\"8\" height=\"8\" x=\"13\" y=\"13\" rx=\"2\" />", "wrench": "<path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\" />", "zap": "<path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\" />"};</script>
<script>
(function(){
const D = window.DECLIC, I = window.ICONES, app = document.getElementById('app');
const ic = n => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n] || I['wrench'] || ''}</svg></span>`;
const ph = f => 'assets/experts/' + f;
const logo = o => D.logos[o] ? `<img src="assets/logos/${D.logos[o]}" alt="">` : `<span class="gen">${ic('wrench')}</span>`;
const nb = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st = { profil: {}, taille: null, lieu: null, effectifs: {}, secteur: null, secteurAutre: '', depts: [], taches: {}, ordre: {}, autres: {}, outils: {}, infos: { lieux: [] }, mat: {}, objectif: null, libre: {} };
const parId = {}; D.departements.forEach(d => d.taches.forEach(t => parId[t.id] = { t, d }));
const dep = id => D.departements.find(d => d.id === id);
const autreId = d => 'x-' + d;
function tache(id){
  if (parId[id]) return parId[id];
  const d = dep(id.slice(2)), a = st.autres[d.id] || {};
  return { d, t: { id, label: a.label || 'Autre tâche', fait: `${d.expert} regarde cette tâche avec vous pendant la démonstration.` } };
}

// La fleur Yelema : six pétales arrondis autour d'un cœur corail.
const PET = ['#2E4EC4', '#4A299C', '#8D68FA', '#6F4BDF', '#A486FB', '#301667'];
function fleur(cls, rayon){
  return [0,1,2,3,4,5].map(k => `<g transform="rotate(${30+k*60} 240 240)"><rect class="${cls}" x="${240-rayon/2}" y="12" width="${rayon}" height="236" rx="${rayon/2}" fill="${PET[k]}" style="animation-delay:${k*.12}s"/></g>`).join('');
}
function majMini(f){ document.getElementById('mini').innerHTML = [0,1,2,3,4,5].map(k => `<g transform="rotate(${30+k*60} 240 240)"><rect x="196" y="16" width="88" height="224" rx="44" fill="${k < Math.round(f*6) ? PET[k] : '#DCD5F7'}"/></g>`).join('') + `<circle cx="240" cy="240" r="40" fill="${f > 0 ? '#E4765A' : '#DCD5F7'}"/>`; }

// Écrans construits à la volée : un écran de tâches par service choisi.
function ecrans(){
  const L = ['accueil', 'profil', 'taille', 'equipes', 'secteur', 'services'];
  st.depts.forEach(d => L.push('taches:' + d));
  L.push('infos', 'maturite', 'objectif', 'libre', 'analyse', 'resultat');
  return L;
}
let pos = 0;
function aller(n){
  const L = ecrans(); pos = Math.max(0, Math.min(n, L.length - 1));
  const [nom, arg] = L[pos].split(':');
  app.innerHTML = `<section class="screen on">${VUES[nom](arg)}</section>`;
  const q = L.length - 3, f = Math.min(1, pos / q);
  document.getElementById('prog').style.width = (f * 100) + '%'; majMini(f);
  document.getElementById('stepn').textContent = pos === 0 ? 'Trois minutes' : pos <= q ? `Question ${pos} sur ${q}` : 'Votre Déclic';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (APRES[nom]) APRES[nom](arg);
}
const suiv = () => aller(pos + 1), prec = () => aller(pos - 1);
const nav = (label) => `<div class="nav"><button class="btn btn-g" data-a="prec">${ic('arrow-left')} Retour</button><button class="btn btn-p" data-a="suiv" id="go">${label || 'Continuer'} ${ic('arrow-right')}</button></div><div class="err" id="err" role="alert"></div>`;
const tete = (icone, eyebrow, titre, lede) => `<div class="wrap"><div class="q-h"><div class="q-ic">${ic(icone)}</div><div class="eyebrow">${eyebrow}</div></div><h2>${titre}</h2><p class="lede">${lede}</p>`;
const carte = (attr, val, icone, label, sel, sous) => `<button class="card ${sel ? 'sel' : ''}" data-${attr}="${esc(val)}"><span class="tick">${ic('check')}</span><span class="chip">${ic(icone)}</span><span class="t">${label}</span>${sous ? `<span class="s">${sous}</span>` : ''}</button>`;
const echelle = (cle, opts, val) => `<div class="scale">${opts.map((r, i) => `<button class="sc ${val === i ? 'on' : ''}" data-q="${cle}" data-v="${i}"><span class="dots">${[0,1,2,3].map(j => `<i class="${j <= i ? 'f' : ''}"></i>`).join('')}</span>${r}</button>`).join('')}</div>`;

const VUES = {
  accueil: () => `<div class="hero" style="margin-top:-40px"><div class="wrap in">
      <div><div class="eyebrow">Le Déclic, par Yelema</div>
        <h1>Voyez où votre entreprise <em>perd du temps</em>.</h1>
        <p>Trois minutes de clics. Le Déclic repère vos tâches les plus pénibles, mesure le temps qu'elles vous coûtent, calcule votre note de maturité IA et vous présente les Experts IA qui reprennent le travail.</p>
        <button class="btn btn-p btn-big" data-a="suiv">${ic('sparkles')} Faire mon Déclic</button>
        <div class="perks"><span>${ic('timer')} 3 minutes</span><span>${ic('gauge')} Résultat immédiat</span></div>
      </div>
      <div style="position:relative">
        <svg class="bloom" viewBox="0 0 480 480"><g class="spin">${fleur('p', 92)}</g><circle class="core" cx="240" cy="240" r="34" fill="#E4765A"/></svg>
        <div class="floaty" style="left:-10px;top:12%"><img src="${ph('av-kouassi-sq.jpg')}" alt="">Kouassi relance vos devis</div>
        <div class="floaty" style="right:-14px;top:52%;animation-delay:1.5s"><img src="${ph('av-mamadou-sq.jpg')}" alt="">Mamadou suit vos impayés</div>
        <div class="floaty" style="left:4%;bottom:0;animation-delay:3s"><img src="${ph('av-awa-sq.jpg')}" alt="">Awa répond jour et nuit</div>
      </div></div></div>`,

  profil: () => { const p = st.profil;
    return tete('user', 'Faisons connaissance', 'Qui êtes-vous ?', 'Pour adapter le Déclic à votre poste et vous recontacter.') +
    `<div class="form">
      <div class="fld">${ic('user')}<label>Prénom et nom<input id="nom" autocomplete="name" placeholder="Awa Koné" value="${esc(p.nom)}"></label></div>
      <div class="fld">${ic('mail')}<label>Email professionnel<input id="email" type="email" autocomplete="email" placeholder="awa@entreprise.ci" value="${esc(p.email)}"></label></div>
      <div class="fld">${ic('building-2')}<label>Entreprise<input id="entreprise" autocomplete="organization" placeholder="Nom de votre entreprise" value="${esc(p.entreprise)}"></label></div>
      <div class="fld">${ic('layers')}<label>Votre service<select id="service" class="sel-f"><option value="">Choisir…</option>${D.departements.map(d => `<option ${p.service === d.nom ? 'selected' : ''}>${d.nom}</option>`).join('')}<option ${p.service === 'Autre' ? 'selected' : ''} value="Autre">Autre service</option></select></label></div>
      <div class="fld full" id="srv-autre" style="${p.service === 'Autre' ? '' : 'display:none'}">${ic('pencil-line')}<label>Lequel ?<input id="serviceAutre" placeholder="Ex. qualité, sécurité, achats" value="${esc(p.serviceAutre)}"></label></div>
      <div class="fld full">${ic('briefcase')}<label>Votre fonction<input id="fonction" autocomplete="organization-title" placeholder="Directrice financière" value="${esc(p.fonction)}"></label></div>
    </div>` + nav() + '</div>'; },

  taille: () => tete('users', 'Votre entreprise', 'Combien êtes-vous ?', 'Toute l\'entreprise, siège et agences confondus.') +
    `<div class="cards c4">${D.tailles.map(t => carte('taille', t.label, t.icone, t.label, st.taille === t.label)).join('')}</div>` + nav() + '</div>',

  equipes: () => tete('map-pin', 'Vos équipes', 'Où travaillent vos équipes ?', 'Les équipes terrain parlent aux Experts par message ou par vocal, depuis leur téléphone.') +
    `<div class="cards c3">${D.equipes.lieu.map(l => carte('lieu', l.id, l.icone, l.label, st.lieu === l.id)).join('')}</div>
    <div class="sub-h">${ic('users')} Combien de personnes, à peu près, à chaque niveau ? <span style="font-weight:400;color:var(--muted);font-size:14px">(facultatif)</span></div>
    <div class="levels">${D.equipes.niveaux.map(n => `<div class="lvl-r"><span class="t"><span class="chip">${ic(n.icone)}</span>${n.label}</span><div class="opts">${D.equipes.tranches.map(t => `<button class="hb ${st.effectifs[n.id] === t ? 'on' : ''}" data-eff="${n.id}" data-t="${t}">${t}</button>`).join('')}</div></div>`).join('')}</div>` + nav() + '</div>',

  secteur: () => { const autre = D.secteurs.find(s => s.autre);
    return tete('globe', 'Votre métier', 'Dans quel secteur travaillez-vous ?', 'Le Déclic adapte ses exemples à votre métier.') +
    `<div class="cards c4">${D.secteurs.map(t => carte('secteur', t.label, t.icone, t.label, st.secteur === t.label)).join('')}</div>
    <div class="fld autre-in" id="sect-autre" style="${st.secteur === autre.label ? '' : 'display:none'}">${ic('pencil-line')}<label>Votre secteur<input id="secteurAutre" placeholder="Ex. cosmétique, sécurité privée" value="${esc(st.secteurAutre)}"></label></div>` + nav() + '</div>'; },

  services: () => tete('layers', 'Vos services', 'Quels services voulez-vous soulager ?', 'Choisissez-en autant que vous voulez. Chaque service a son Expert IA.') +
    `<div class="cards c4">${D.departements.map(d => `<button class="card ${st.depts.includes(d.id) ? 'sel' : ''}" data-dept="${d.id}"><span class="tick">${ic('check')}</span>
      <span class="face"><img src="${ph(d.photo)}" alt=""><span class="chip">${ic(d.icone)}</span></span><span class="t">${d.nom}</span><span class="s">Avec ${d.expert}</span></button>`).join('')}</div>` + nav() + '</div>',

  taches: id => { const d = dep(id), k = st.depts.indexOf(id) + 1, a = st.autres[id] || {}, xid = autreId(id);
    const heures = tid => `<div class="hours"><span class="lab">${ic('clock')} Temps perdu chaque semaine, pour toute l'équipe</span>${D.temps.map(x => `<button class="hb ${st.taches[tid] === x.heures ? 'on' : ''}" data-h="${x.heures}" data-tt="${tid}">${x.label}</button>`).join('')}</div>`;

function verifier(){
  const [nom, arg] = ecrans()[pos].split(':'), err = m => { document.getElementById('err').textContent = m; return false; };
  if (nom === 'profil') {
    ['nom', 'email', 'entreprise', 'fonction', 'service', 'serviceAutre'].forEach(k => st.profil[k] = document.getElementById(k).value.trim());
    if (!st.profil.nom || !st.profil.email || !st.profil.entreprise || !st.profil.fonction || !st.profil.service) return err('Merci de remplir les cinq champs.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.profil.email)) return err("L'adresse email semble incomplète.");
  }
  if (nom === 'taille' && !st.taille) return err('Choisissez une taille.');
  if (nom === 'equipes' && !st.lieu) return err('Dites-nous où travaillent vos équipes.');
  if (nom === 'secteur') { st.secteurAutre = (document.getElementById('secteurAutre') || {}).value || ''; if (!st.secteur) return err('Choisissez un secteur.'); if (D.secteurs.find(s => s.autre).label === st.secteur && !st.secteurAutre.trim()) return err('Précisez votre secteur.'); }
  if (nom === 'services' && !st.depts.length) return err('Choisissez au moins un service.');
  if (nom === 'taches') {
    const c = [...dep(arg).taches.map(t => t.id), autreId(arg)].filter(t => t in st.taches);
    if (!c.length) return err('Cochez au moins une tâche qui vous fait perdre du temps.');
    const manque = c.filter(t => !(st.taches[t] > 0));
    if (manque.length) { const el = app.querySelector(`.task[data-t="${manque[0]}"]`); el.classList.remove('manque'); void el.offsetWidth; el.classList.add('manque'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return err(`Indiquez le temps perdu pour ${manque.length > 1 ? 'les ' + manque.length + ' tâches cochées en rouge' : 'la tâche en rouge'}.`); }
  }
  if (nom === 'infos' && (st.infos.epar == null || st.infos.wa == null)) return err('Répondez aux deux questions.');
  if (nom === 'maturite' && Object.keys(st.mat).length !== D.maturite.length) return err('Répondez aux trois questions.');
  if (nom === 'objectif' && !st.objectif) return err('Choisissez votre attente principale.');
  if (nom === 'libre') { st.libre.irritants = document.getElementById('irritants').value.trim(); st.libre.automatiser = document.getElementById('automatiser').value.trim(); }
  return true;
}
function cocher(tid, did, on){
  const box = app.querySelector(`.task[data-t="${tid}"]`), L = st.ordre[did] = st.ordre[did] || [];
  if (on) { if (!(tid in st.taches)) st.taches[tid] = 0; if (!L.includes(tid)) L.push(tid); }
  else { delete st.taches[tid]; st.ordre[did] = L.filter(x => x !== tid); }
  box.classList.toggle('sel', on); box.classList.remove('manque');
  if (!on) box.querySelectorAll('.hb').forEach(h => h.classList.remove('on'));
  majClassement(did);
}

function calcul(){
  const liste = [];
  st.depts.forEach(did => (st.ordre[did] || []).forEach((tid, rang) => { const h = st.taches[tid]; if (h > 0) { const x = tache(tid); liste.push({ ...x, h, rang, score: h * (rang === 0 ? 1.3 : rang === 1 ? 1.15 : 1) }); } }));
  liste.sort((a, b) => b.score - a.score);
  const total = liste.reduce((s, x) => s + x.h, 0), repris = total * D.partReprise;
  const parD = {}; liste.forEach(x => { (parD[x.d.id] = parD[x.d.id] || { d: x.d, h: 0, t: [] }); parD[x.d.id].h += x.h; parD[x.d.id].t.push(x.t); });
  const ds = Object.values(parD).sort((a, b) => b.h - a.h);
  const pts = Object.values(st.mat).reduce((s, v) => s + v, 0) + (3 - (st.infos.epar || 0));
  const note = Math.round(pts / (3 * (D.maturite.length + 1)) * 100);
  const niv = [...D.niveaux].reverse().find(n => note >= n.min);
  return { liste, total, repris, ds, note, niv };
}
