<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Le Déclic, par Yelema</title>
<meta name="description" content="En trois minutes, voyez où votre entreprise perd du temps et quel Expert IA le reprend.">
<link rel="icon" href="assets/logo/yelema-icon.png">
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url('assets/fonts/SpaceGrotesk-Variable.woff2') format('woff2')}
@font-face{font-family:'Funnel Display';font-weight:300 800;font-display:swap;src:url('assets/fonts/FunnelDisplay-Variable.woff2') format('woff2')}
:root{
  --indigo:#301667;--indigo2:#1C0F3D;--violet:#8D68FA;--violet-deep:#4A299C;--lav:#C5C4FF;--lavp:#E0E1FF;
  --lilac:#F3EFFE;--lilac2:#EFE9FF;--bleu:#2E4EC4;--corail:#E4765A;--corailp:#FBE7E2;--ink:#241A3A;--muted:#6B6580;--grey2:#938DA8;--line:#ECE8FA;
  --card-dark:#3D227E;--border-dark:#4E3096;--green:#22A45D;
  --grad:linear-gradient(135deg,#2E4EC4,#8D68FA);
  --hero:radial-gradient(120% 120% at 15% 0%,#3B1F7A 0%,#301667 40%,#1C0F3D 100%);
  --sh:0 16px 40px rgba(48,22,103,.10);--sh2:0 24px 60px rgba(48,22,103,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Funnel Display',system-ui,sans-serif;color:var(--ink);background:#F7F5FE;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,.sg{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
.ic{display:inline-block;width:22px;height:22px;flex:0 0 auto}
.ic svg{width:100%;height:100%;display:block}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.eyebrow{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}

/* Barre du haut */
.top{position:sticky;top:0;z-index:20;background:rgba(28,15,61,.92);backdrop-filter:blur(10px);color:#fff}
.top .in{display:flex;align-items:center;gap:16px;height:64px}
.top img.logo{height:26px}
.prog{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;max-width:420px;margin-left:auto}
.prog i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mini{width:34px;height:34px}
.mini rect{transition:fill .4s}

/* Écrans */
.screen{display:none;padding:40px 0 60px;min-height:calc(100vh - 64px)}
.screen.on{display:block;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.q-ic{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(141,104,250,.35)}
.q-ic .ic{width:26px;height:26px}
.screen h2{font-size:32px;color:var(--indigo);margin:14px 0 6px;line-height:1.1}
.lede{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:640px}

/* Accueil */
.hero{background:var(--hero);color:#fff;border-radius:0 0 40px 40px;padding:40px 0 70px;position:relative;overflow:hidden}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:52px;line-height:1.02;margin:12px 0 16px}
.hero h1 em{font-style:normal;color:var(--corail)}
.hero p{color:var(--lav);font-size:19px;margin:0 0 28px}
.perks{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px}
.perks > span{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:999px}
.perks .ic{width:18px;height:18px;color:var(--lav)}
.bloom{width:100%;max-width:380px;justify-self:center;filter:drop-shadow(0 30px 50px rgba(0,0,0,.35))}
.bloom .p{transform-origin:240px 240px;transform:scale(0) rotate(-60deg);animation:open 1.1s cubic-bezier(.2,.9,.25,1.2) forwards}
@keyframes open{to{transform:scale(1) rotate(0)}}
.bloom .core{transform-origin:240px 240px;animation:pulse 3s ease-in-out 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.bloom .spin{transform-origin:240px 240px;animation:spin 40s linear 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.floaty{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;color:var(--indigo);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:600;box-shadow:var(--sh2);animation:float 5s ease-in-out infinite}
.floaty img{width:30px;height:30px;border-radius:999px;object-fit:cover}
@keyframes float{50%{transform:translateY(-10px)}}

/* Cartes à cliquer */
.cards{display:grid;gap:14px}
.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;box-shadow:0 2px 0 rgba(48,22,103,.04)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#D9CCFD}
.card:active{transform:scale(.98)}
.card .chip{width:46px;height:46px;border-radius:14px;background:var(--lavp);color:var(--violet);display:grid;place-items:center;transition:all .2s}
.card .t{font-family:'Space Grotesk';font-weight:500;color:var(--indigo);line-height:1.2}
.card .s{font-size:13px;color:var(--muted)}
.card .tick{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:999px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;transition:all .2s;transform:scale(.9)}
.card .tick .ic{width:15px;height:15px}
.card.sel{border-color:var(--violet);background:linear-gradient(180deg,#fff,var(--lilac));box-shadow:0 14px 34px rgba(141,104,250,.22)}
.card.sel .chip{background:var(--grad);color:#fff}
.card.sel .tick{background:var(--violet);border-color:var(--violet);transform:scale(1);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.card .face{display:flex;align-items:center;gap:10px}
.card .face img{width:46px;height:46px;border-radius:999px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(30,16,80,.18)}
.card .face .chip{width:34px;height:34px;border-radius:11px;margin-left:-18px;margin-top:22px;border:2px solid #fff}
.card .face .chip .ic{width:17px;height:17px}

/* Formulaire */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;transition:border-color .18s,box-shadow .18s}
.fld:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(141,104,250,.15)}
.fld .ic{color:var(--violet)}
.fld label{flex:1;font-size:12px;font-weight:600;color:var(--grey2);text-transform:uppercase;letter-spacing:.08em}
.fld input{display:block;width:100%;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:none;padding:4px 0 0;text-transform:none;letter-spacing:0;font-weight:400}

/* Tâches */
.task{background:#fff;border:1.5px solid var(--line);border-radius:20px;margin-bottom:12px;transition:all .2s;overflow:hidden}
.task.sel{border-color:var(--violet);box-shadow:0 14px 34px rgba(141,104,250,.18)}
.task-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:16px 18px;text-align:left}
.task-row .box{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid #D3CBF3;display:grid;place-items:center;color:#fff;transition:all .2s}
.task-row .box .ic{width:15px;height:15px}
.task.sel .box{background:var(--violet);border-color:var(--violet)}
.task-row span.l{font-weight:500;color:var(--indigo);font-size:16px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px;max-height:0;opacity:0;transition:all .3s}
.task.sel .hours{max-height:260px;opacity:1;padding:0 18px 16px}
.hours .lab{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hours .lab .ic{width:15px;height:15px;color:var(--corail)}
.hb{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font-size:15px;font-weight:600;color:var(--indigo);text-align:center;transition:all .15s}
.hb b{display:block;font-family:'Space Grotesk';font-size:18px;color:var(--indigo)}
.hb:hover{border-color:var(--violet)}
.hb.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.hb.on b{color:#fff}
.tools{margin-top:22px;background:#fff;border-radius:20px;padding:18px;border:1.5px dashed #D9CCFD}
.tools p{margin:0 0 12px;font-weight:600;color:var(--indigo);display:flex;gap:8px;align-items:center}
.tools p .ic{color:var(--violet)}
.logos{display:flex;flex-wrap:wrap;gap:10px}
.logo-b{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;transition:all .15s}
.logo-b img{width:24px;height:24px;object-fit:contain}
.logo-b.on{border-color:var(--violet);background:var(--lilac);box-shadow:0 6px 16px rgba(141,104,250,.2)}
.exp-pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--sh);margin-bottom:18px}
.exp-pill img{width:40px;height:40px;border-radius:999px;object-fit:cover}
.exp-pill span{font-size:14px;color:var(--muted)}
.exp-pill b{color:var(--indigo)}

/* Maturité */
.mq{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;border:1.5px solid var(--line)}
.mq h3{display:flex;align-items:center;gap:12px;margin:0 0 14px;color:var(--indigo);font-size:19px}
.mq h3 .chip{width:40px;height:40px;border-radius:12px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sc{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 10px;font-size:14px;text-align:left;transition:all .15s;position:relative}
.sc .dots{display:flex;gap:3px;margin-bottom:8px}
.sc .dots i{width:14px;height:5px;border-radius:999px;background:var(--line)}
.sc .dots i.f{background:var(--violet)}
.sc:hover{border-color:var(--violet)}
.sc.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.sc.on .dots i{background:rgba(255,255,255,.25)}.sc.on .dots i.f{background:#fff}

/* Navigation */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
.btn{border:0;border-radius:999px;padding:15px 28px;font-weight:600;font-size:16px;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .18s,box-shadow .18s,opacity .2s}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(141,104,250,.4)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(141,104,250,.5)}
.btn-p:disabled{opacity:.45;transform:none;box-shadow:none;cursor:not-allowed}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--indigo)}
.btn-g:hover{border-color:var(--violet);color:var(--violet)}
.btn-w{background:#fff;color:var(--indigo);box-shadow:0 10px 26px rgba(0,0,0,.25)}
.btn-big{padding:18px 34px;font-size:18px}
.err{color:var(--corail);font-size:14px;min-height:20px;margin-top:12px;font-weight:500}

/* Analyse */
.analyse{text-align:center;padding-top:80px}
.analyse svg{width:200px;height:200px;animation:spin 1.6s cubic-bezier(.5,.1,.5,.9) infinite}
.analyse h2{margin-top:30px}
.steps-a{list-style:none;padding:0;margin:20px auto 0;max-width:360px;text-align:left}
.steps-a li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);opacity:.35;transition:opacity .3s}
.steps-a li.on{opacity:1;color:var(--indigo)}
.steps-a .ic{width:20px;height:20px;color:var(--green)}

/* Résultat */
.r-hero{background:var(--hero);color:#fff;border-radius:32px;padding:30px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.r-hero::after{content:"";position:absolute;right:-60px;bottom:-90px;width:300px;height:300px;background:url('assets/site-pattern-3.svg') no-repeat center/contain;opacity:.25}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:'Space Grotesk';font-size:56px;line-height:1;display:block}
.ring .v small{color:var(--lav);font-size:14px}
.r-hero h2{color:#fff;font-size:34px;margin:6px 0 10px}
.r-hero .lvl{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:600;color:#fff}
.r-hero .lvl .ic{width:18px;height:18px;color:var(--corail)}
.r-hero p{color:var(--lav);margin:12px 0 0;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 8px}
.kpi{background:#fff;border-radius:22px;padding:20px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--sh)}
.kpi .chip{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--grad);flex:0 0 auto}
.kpi.k1 .chip{background:linear-gradient(135deg,#E4765A,#F0A08A)}
.kpi b{font-family:'Space Grotesk';font-size:40px;line-height:1;color:var(--indigo);display:block}
.kpi b small{font-size:16px;margin-left:3px}
.kpi div > span{font-size:14px;color:var(--muted)}
.sec-t{font-size:24px;color:var(--indigo);margin:40px 0 6px}
.sec-l{color:var(--muted);margin:0 0 16px}
.bars{background:#fff;border-radius:22px;padding:22px;box-shadow:var(--sh);display:grid;gap:14px}
.barrow{display:grid;grid-template-columns:36px 180px 1fr 64px;gap:12px;align-items:center;font-size:15px}
.barrow .chip{width:36px;height:36px;border-radius:11px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.barrow .chip .ic{width:18px;height:18px}
.track{height:16px;background:var(--lilac);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--grad);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.barrow b{font-family:'Space Grotesk';color:var(--indigo);text-align:right}
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pain{background:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);position:relative;overflow:hidden}
.pain::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--grad)}
.pain .rk{display:flex;justify-content:space-between;align-items:center}
.pain .rk span{font-family:'Space Grotesk';font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--violet)}
.pain .rk .chip{width:40px;height:40px;border-radius:12px;background:var(--lavp);color:var(--violet);display:grid;place-items:center}
.pain h4{margin:0;color:var(--indigo);font-size:18px;line-height:1.25;font-weight:500}
.pain .h{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--corail);font-weight:600;background:var(--corailp);padding:4px 10px;border-radius:999px;align-self:flex-start}
.pain .h .ic{width:15px;height:15px}
.pain p{margin:0;color:var(--muted);font-size:15px}
.pain .who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pain .who img{width:36px;height:36px;border-radius:999px;object-fit:cover}
.experts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.xcard{border-radius:24px;padding:22px;background:var(--indigo);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh2);transition:transform .2s}
.xcard:hover{transform:translateY(-4px)}
.xcard:nth-child(2){background:var(--violet-deep)}.xcard:nth-child(3){background:var(--violet)}
.xcard .top-x{display:flex;justify-content:space-between;align-items:flex-start}
.xcard img{width:72px;height:72px;border-radius:999px;object-fit:cover;border:3px solid rgba(255,255,255,.75)}
.match{width:64px;height:64px;position:relative}
.match svg{width:100%;height:100%;transform:rotate(-90deg)}
.match b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Space Grotesk';font-size:16px}
.xcard h4{margin:14px 0 2px;font-size:22px}
.xcard .m{color:var(--lav);font-size:14px}
.xcard:nth-child(3) .m{color:#fff}
.xcard ul{list-style:none;margin:14px 0 0;padding:0;font-size:14px;display:grid;gap:6px}
.xcard li{display:flex;gap:8px;align-items:flex-start}
.xcard li .ic{width:16px;height:16px;margin-top:2px;color:var(--lav)}
.xcard .gain{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;display:flex;gap:8px;align-items:center}
.xcard .gain .ic{width:16px;height:16px}
.offer{margin-top:36px;border-radius:32px;background:var(--hero);color:#fff;padding:32px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.offer h3{margin:8px 0 10px;font-size:30px}
.offer p{color:var(--lav);margin:0}
.offer .cta{display:flex;flex-direction:column;gap:12px;align-items:flex-start;position:relative;z-index:1}
.stack{display:flex;margin-bottom:6px}
.stack img{width:48px;height:48px;border-radius:999px;object-fit:cover;border:3px solid #fff;margin-left:-12px}
.stack img:first-child{margin-left:0}
.note{font-size:13px;color:var(--grey2);margin-top:18px}
footer{padding:22px 0 30px;color:var(--grey2);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

@media (max-width:860px){
  .hero .in{grid-template-columns:1fr}.bloom{max-width:240px;order:-1}
  .c4{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(2,1fr)}
  .kpis,.pains,.experts{grid-template-columns:1fr}
  .offer,.r-hero{grid-template-columns:1fr}.ring{margin:0 auto}
  .barrow{grid-template-columns:32px 1fr 56px}.barrow .track{grid-column:2/4;grid-row:2}
  .scale{grid-template-columns:repeat(2,1fr)}
  .floaty{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 16px}.form{grid-template-columns:1fr}
  .hero h1{font-size:36px}.screen h2{font-size:26px}
  .hours{grid-template-columns:repeat(2,1fr)}
  .top img.logo{height:22px}
  .nav .btn{padding:14px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bloom .p{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap in">
  <img class="logo" src="assets/logo/yelema-logo-blanc.png" alt="Yelema">
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <svg class="mini" id="mini" viewBox="0 0 480 480" aria-hidden="true"></svg>
</div></header>

<div id="app"></div>

<script>
(function(){
const D = window.DECLIC, I = window.ICONES, app = document.getElementById('app');
const ic = n => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n] || ''}</svg></span>`;
const ph = f => 'assets/experts/' + f, lg = o => 'assets/logos/' + D.logos[o];
const nb = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st = { profil: {}, taille: null, secteur: null, depts: [], taches: {}, outils: {}, mat: {}, objectif: null };
const parId = {}; D.departements.forEach(d => d.taches.forEach(t => parId[t.id] = { t, d }));
const dep = id => D.departements.find(d => d.id === id);

// La fleur Yelema : six pétales arrondis autour d'un cœur (trois barres croisées à 30, 90 et 150 degrés).
const PET = ['#2E4EC4', '#4A299C', '#8D68FA', '#6F4BDF', '#A486FB', '#301667'];
function fleur(cls, couleurs, rayon){
  return [0,1,2,3,4,5].map(k => `<g transform="rotate(${30+k*60} 240 240)"><rect class="${cls}" x="${240-rayon/2}" y="12" width="${rayon}" height="236" rx="${rayon/2}" fill="${couleurs[k]}" style="animation-delay:${k*.12}s"/></g>`).join('');
}
function majMini(f){ document.getElementById('mini').innerHTML = [0,1,2,3,4,5].map(k => `<rect x="200" y="20" width="80" height="220" rx="40" fill="${k < Math.round(f*6) ? PET[k] : 'rgba(255,255,255,.18)'}" transform="rotate(${30+k*60} 240 240)"/>`).join(''); }

// Écrans : construits à la volée, les écrans de tâches suivent les services choisis.
function ecrans(){
  const L = ['accueil', 'profil', 'taille', 'secteur', 'services'];
  st.depts.forEach(d => L.push('taches:' + d));
  L.push('maturite', 'objectif', 'analyse', 'resultat');
  return L;
}
let pos = 0;
function aller(n){
  const L = ecrans(); pos = Math.max(0, Math.min(n, L.length - 1));
  const [nom, arg] = L[pos].split(':');
  app.innerHTML = `<section class="screen on">${VUES[nom](arg)}</section>`;
  const f = pos / (L.length - 1);
  document.getElementById('prog').style.width = (f * 100) + '%'; majMini(f);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (APRES[nom]) APRES[nom](arg);
}
const suiv = () => aller(pos + 1), prec = () => aller(pos - 1);
const nav = (ok, label) => `<div class="nav"><button class="btn btn-g" data-a="prec">${ic('arrow-left')} Retour</button><button class="btn btn-p" data-a="suiv" ${ok ? '' : 'disabled'} id="go">${label || 'Continuer'} ${ic('arrow-right')}</button></div><div class="err" id="err"></div>`;
const tete = (icone, eyebrow, titre, lede) => `<div class="wrap"><div class="q-h"><div class="q-ic">${ic(icone)}</div><div class="eyebrow">${eyebrow}</div></div><h2>${titre}</h2><p class="lede">${lede}</p>`;

const VUES = {
  accueil: () => `<div class="hero" style="margin-top:-40px"><div class="wrap in">
      <div><div class="eyebrow" style="color:#C5B8FF">Le Déclic, par Yelema</div>
        <h1>Voyez où votre entreprise <em>perd du temps</em>.</h1>
        <p>Une dizaine de clics, trois minutes. Le Déclic vous montre vos tâches les plus coûteuses, votre note de maturité IA et les Experts IA qui reprennent le travail.</p>
        <button class="btn btn-w btn-big" data-a="suiv">${ic('sparkles')} Faire mon Déclic</button>
        <div class="perks"><span>${ic('timer')} 3 minutes</span><span>${ic('gauge')} Résultat immédiat</span><span>${ic('shield-check')} Gratuit, sans engagement</span></div>
      </div>
      <div style="position:relative">
        <svg class="bloom" viewBox="0 0 480 480"><g class="spin">${fleur('p', PET, 92)}</g><circle class="core" cx="240" cy="240" r="34" fill="#E4765A"/></svg>
        <div class="floaty" style="left:-10px;top:16%"><img src="${ph('av-kouassi-sq.jpg')}" alt="">Kouassi relance vos devis</div>
        <div class="floaty" style="right:-10px;top:48%;animation-delay:1.5s"><img src="${ph('av-mamadou-sq.jpg')}" alt="">Mamadou suit vos impayés</div>
        <div class="floaty" style="left:8%;bottom:4%;animation-delay:3s"><img src="${ph('av-awa-sq.jpg')}" alt="">Awa répond jour et nuit</div>
      </div></div></div>`,

  profil: () => tete('user', 'Étape 1', 'Faisons connaissance.', 'Votre diagnostic vous est adressé à cette adresse.') +
    `<div class="form">${[['nom','user','Prénom et nom','Awa Koné','name'],['email','mail','Email professionnel','awa@entreprise.ci','email'],['entreprise','building-2','Entreprise','Nom de votre entreprise','organization'],['fonction','briefcase','Votre fonction','Directrice financière','organization-title']]
      .map(([k,i,l,p,a]) => `<div class="fld">${ic(i)}<label>${l}<input id="${k}" autocomplete="${a}" ${k==='email'?'type="email"':''} placeholder="${p}" value="${esc(st.profil[k]||'')}"></label></div>`).join('')}</div>` + nav(true) + '</div>',

  taille: () => tete('users', 'Étape 2', 'Combien êtes-vous ?', 'Toute l\'entreprise, siège et agences confondus.') +
    `<div class="cards c4">${D.tailles.map(t => `<button class="card ${st.taille===t.label?'sel':''}" data-taille="${t.label}"><span class="tick">${ic('check')}</span><span class="chip">${ic(t.icone)}</span><span class="t">${t.label}</span></button>`).join('')}</div>` + nav(!!st.taille) + '</div>',

  secteur: () => tete('globe', 'Étape 3', 'Dans quel secteur travaillez-vous ?', 'Le Déclic adapte ses exemples à votre métier.') +
    `<div class="cards c4">${D.secteurs.map(t => `<button class="card ${st.secteur===t.label?'sel':''}" data-secteur="${t.label}"><span class="tick">${ic('check')}</span><span class="chip">${ic(t.icone)}</span><span class="t">${t.label}</span></button>`).join('')}</div>` + nav(!!st.secteur) + '</div>',

  services: () => tete('layers', 'Étape 4', 'Quels services voulez-vous soulager ?', 'Choisissez-en un ou plusieurs. Chaque service a son Expert IA.') +
    `<div class="cards c4">${D.departements.map(d => `<button class="card ${st.depts.includes(d.id)?'sel':''}" data-dept="${d.id}"><span class="tick">${ic('check')}</span>
      <span class="face"><img src="${ph(d.photo)}" alt=""><span class="chip">${ic(d.icone)}</span></span><span class="t">${d.nom}</span><span class="s">Avec ${d.expert}</span></button>`).join('')}</div>` + nav(st.depts.length > 0) + '</div>',

  taches: id => { const d = dep(id), k = st.depts.indexOf(id) + 1;
    return tete(d.icone, `Service ${k} sur ${st.depts.length}`, `${d.nom} : où perdez-vous du temps ?`, 'Cochez ce qui vous coûte des heures, puis dites combien par semaine, toute l\'équipe confondue.') +
    `<div class="exp-pill"><img src="${ph(d.photo)}" alt=""><span><b>${d.expert}</b> reprend ces tâches pour vous</span></div>` +
    d.taches.map(t => { const h = st.taches[t.id]; return `<div class="task ${t.id in st.taches?'sel':''}" data-t="${t.id}">
        <button class="task-row" data-tache="${t.id}"><span class="box">${ic('check')}</span><span class="l">${t.label}</span></button>
        <div class="hours"><span class="lab">${ic('clock')} Combien d'heures par semaine ?</span>
          ${D.temps.map(x => `<button class="hb ${h===x.heures?'on':''}" data-h="${x.heures}" data-tt="${t.id}">${x.label}</button>`).join('')}</div></div>`; }).join('') +
    `<div class="tools"><p>${ic('zap')} Les outils que ce service utilise</p><div class="logos">${d.outils.map(o => `<button class="logo-b ${(st.outils[id]||[]).includes(o)?'on':''}" data-outil="${o}" data-d="${id}"><img src="${lg(o)}" alt="">${o}</button>`).join('')}</div></div>` + nav(okTaches(id)) + '</div>'; },

  maturite: () => tete('brain-circuit', 'Presque fini', 'Où en êtes-vous avec l\'IA ?', 'Trois questions pour calculer votre note de maturité.') +
    D.maturite.map(q => `<div class="mq"><h3><span class="chip">${ic(q.icone)}</span>${q.question}</h3><div class="scale">${q.reponses.map((r, i) => `<button class="sc ${st.mat[q.id]===i?'on':''}" data-q="${q.id}" data-v="${i}"><span class="dots">${[0,1,2,3].map(j => `<i class="${j<=i?'f':''}"></i>`).join('')}</span>${r}</button>`).join('')}</div></div>`).join('') + nav(Object.keys(st.mat).length === D.maturite.length) + '</div>',

  objectif: () => tete('target', 'Dernière question', 'Qu\'attendez-vous d\'abord ?', 'Le Déclic met cette attente en tête de votre plan.') +
    `<div class="cards c4">${D.objectifs.map(o => `<button class="card ${st.objectif===o.id?'sel':''}" data-obj="${o.id}"><span class="tick">${ic('check')}</span><span class="chip">${ic(o.icone)}</span><span class="t">${o.label}</span></button>`).join('')}</div>` + nav(!!st.objectif, 'Voir mon Déclic') + '</div>',

  analyse: () => `<div class="wrap analyse"><svg viewBox="0 0 480 480">${fleur('', PET, 92)}<circle cx="240" cy="240" r="34" fill="#E4765A"/></svg>
    <h2>Le Déclic analyse vos réponses.</h2><ul class="steps-a">
    <li>${ic('check')} Calcul du temps perdu, service par service</li><li>${ic('check')} Classement de vos priorités</li><li>${ic('check')} Choix des Experts IA faits pour vous</li><li>${ic('check')} Calcul de votre note de maturité</li></ul></div>`,

  resultat: () => resultat()
};
const APRES = {
  analyse: () => { const li = document.querySelectorAll('.steps-a li'); li.forEach((l, i) => setTimeout(() => l.classList.add('on'), 350 + i * 420)); setTimeout(suiv, 2300); },
  resultat: () => animer(),
  profil: () => document.getElementById('nom').focus()
};
function okTaches(id){ const c = dep(id).taches.filter(t => t.id in st.taches); return c.length > 0 && c.every(t => st.taches[t.id] > 0); }

function calcul(){
  const liste = Object.entries(st.taches).filter(([id, h]) => h > 0 && st.depts.includes(parId[id].d.id)).map(([id, h]) => ({ ...parId[id], h })).sort((a, b) => b.h - a.h);
  const total = liste.reduce((s, x) => s + x.h, 0), repris = total * D.partReprise;
  const parD = {}; liste.forEach(x => { (parD[x.d.id] = parD[x.d.id] || { d: x.d, h: 0, t: [] }); parD[x.d.id].h += x.h; parD[x.d.id].t.push(x.t); });
  const ds = Object.values(parD).sort((a, b) => b.h - a.h);
  const note = Math.round(Object.values(st.mat).reduce((s, v) => s + v, 0) / (3 * D.maturite.length) * 100);
  const niv = [...D.niveaux].reverse().find(n => note >= n.min);
  return { liste, total, repris, ds, note, niv };
}
function resultat(){
  const R = calcul(), p = st.profil, prenom = (p.nom || '').split(' ')[0], max = R.ds.length ? R.ds[0].h : 1;
  const obj = D.objectifs.find(o => o.id === st.objectif);
  const top = R.ds.slice(0, 2).map(x => x.d), p1 = R.liste[0];
  return `<div class="wrap">
    <div class="r-hero">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="12"/><circle id="ringc" cx="60" cy="60" r="52" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#E4765A"/><stop offset="1" stop-color="#8D68FA"/></linearGradient></defs></svg>
        <div class="v"><div><b class="cnt" data-to="${R.note}">0</b><small>sur 100</small></div></div></div>
      <div style="position:relative;z-index:1"><div class="eyebrow" style="color:#C5B8FF">Votre note de maturité IA</div>
        <h2>${prenom ? esc(prenom) + ', votre' : 'Votre'} Déclic est prêt.</h2>
        <span class="lvl">${ic('rocket')} ${R.niv.nom}</span><p>${R.niv.texte}</p></div>
    </div>
    <div class="kpis">
      <div class="kpi k1"><span class="chip">${ic('clock')}</span><div><b><span class="cnt" data-to="${R.total}">0</span><small>h</small></b><span>perdues chaque semaine sur vos tâches cochées</span></div></div>
      <div class="kpi"><span class="chip">${ic('rotate-ccw')}</span><div><b><span class="cnt" data-to="${R.repris}">0</span><small>h</small></b><span>qu'un Expert IA reprend chaque semaine</span></div></div>
      <div class="kpi"><span class="chip">${ic('calendar')}</span><div><b><span class="cnt" data-to="${R.repris * 4.33 / 8}">0</span><small>jours</small></b><span>de travail rendus à votre équipe chaque mois</span></div></div>
    </div>
    <h3 class="sec-t">Où part votre temps.</h3><p class="sec-l">Heures déclarées par service, chaque semaine.</p>
    <div class="bars">${R.ds.map(x => `<div class="barrow"><span class="chip">${ic(x.d.icone)}</span><span>${x.d.nom}</span><div class="track"><div class="fill" data-w="${x.h / max * 100}"></div></div><b>${nb(x.h)} h</b></div>`).join('')}</div>
    <h3 class="sec-t">Vos trois priorités.</h3><p class="sec-l">Les tâches qui vous coûtent le plus, et ce que l'Expert IA en fait.</p>
    <div class="pains">${R.liste.slice(0, 3).map((x, i) => `<div class="pain"><div class="rk"><span>PRIORITÉ ${i + 1}</span><span class="chip">${ic(x.d.icone)}</span></div><h4>${x.t.label}</h4>
      <span class="h">${ic('clock')} ${nb(x.h)} h par semaine aujourd'hui</span><p>${x.t.fait}</p>
      <div class="who"><img src="${ph(x.d.photo)}" alt=""><span><b>${x.d.expert}</b>, ${x.d.metier.toLowerCase()}</span></div></div>`).join('')}</div>
    <h3 class="sec-t">Les Experts IA faits pour vous.</h3><p class="sec-l">Classés selon le temps qu'ils vous rendent.</p>
    <div class="experts">${R.ds.slice(0, 3).map(x => { const m = Math.min(98, Math.round(70 + 28 * x.h / max)); return `<div class="xcard">
      <div class="top-x"><img src="${ph(x.d.photo)}" alt=""><div class="match"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="${100.5 * (1 - m / 100)}"/></svg><b>${m}%</b></div></div>
      <h4>${x.d.expert}</h4><div class="m">${x.d.metier}</div>
      <ul>${x.t.slice(0, 3).map(t => `<li>${ic('check')}${t.label}</li>`).join('')}</ul>
      <div class="gain">${ic('timer')} ${nb(x.h * D.partReprise)} h rendues chaque semaine</div></div>`; }).join('')}</div>
    <div class="offer"><div><div class="eyebrow" style="color:#C5B8FF">${ic('target')} Votre priorité : ${obj ? obj.label.toLowerCase() : ''}</div>
      <h3>${top.length > 1 ? `Commencez avec ${top[0].expert} et ${top[1].expert}.` : `Commencez avec ${top[0].expert}.`}</h3>
      <p>En une heure de démonstration, nous montrons ${p1.d.expert} sur « ${p1.t.label.toLowerCase()} », dans vos outils${(st.outils[p1.d.id] || []).length ? ' (' + st.outils[p1.d.id].join(', ') + ')' : ''}. Deux Experts IA pour 300 000 F par mois, Djénéba incluse.</p></div>
      <div class="cta"><div class="stack">${top.map(d => `<img src="${ph(d.photo)}" alt="${d.expert}">`).join('')}<img src="${ph('av-chiefofstaff-sq.jpg')}" alt="Djénéba"></div>
        <a class="btn btn-w" href="https://calendly.com/leslie_mstudio/meeting-with-mstudio" target="_blank" rel="noopener">${ic('calendar')} Réserver ma démonstration</a>
        <a class="btn btn-g" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" href="${mailto(R)}">${ic('mail')} Recevoir mon Déclic par email</a></div></div>
    <p class="note">Estimation : un Expert IA reprend environ ${Math.round(D.partReprise * 100)} % du temps déclaré ; un mois compte 4,33 semaines et une journée 8 heures. La note de maturité vient de vos trois réponses sur l'usage de l'IA, vos données et vos façons de faire.</p>
    <div class="nav"><button class="btn btn-g" data-a="refaire">${ic('rotate-ccw')} Modifier mes réponses</button></div></div>`;
}
function mailto(R){
  const p = st.profil, L = [`Le Déclic : ${p.entreprise}`, `${p.nom} (${p.fonction}), ${p.email}`, `${st.taille}, ${st.secteur}`, `Note de maturité IA : ${R.note}/100 (${R.niv.nom})`, `Attente : ${(D.objectifs.find(o => o.id === st.objectif) || {}).label}`, '',
    `Temps perdu : ${nb(R.total)} h par semaine ; repris par un Expert IA : ${nb(R.repris)} h`, '', ...R.liste.map(x => `- ${x.d.nom} : ${x.t.label} (${nb(x.h)} h)`), '',
    ...Object.entries(st.outils).filter(([, l]) => l.length).map(([d, l]) => `Outils ${dep(d).nom} : ${l.join(', ')}`)];
  return 'mailto:contact@yelema.ai?cc=' + encodeURIComponent(p.email) + '&subject=' + encodeURIComponent('Mon Déclic, ' + p.entreprise) + '&body=' + encodeURIComponent(L.join('\n'));
}
function animer(){
  setTimeout(() => { document.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'); const R = calcul(); document.getElementById('ringc').style.strokeDashoffset = 326.7 * (1 - R.note / 100); }, 80);
  document.querySelectorAll('.cnt').forEach(el => { const to = +el.dataset.to, t0 = performance.now(); const pas = t => { const k = Math.min(1, (t - t0) / 1300), e = 1 - Math.pow(1 - k, 3); el.textContent = nb(to * e); if (k < 1) requestAnimationFrame(pas); }; requestAnimationFrame(pas); });
}

// Clics
app.addEventListener('click', e => {
  const b = e.target.closest('button,[data-a]'); if (!b) return;
  const err = document.getElementById('err'), go = document.getElementById('go');
  const a = b.dataset.a;
  if (a === 'prec') return prec();
  if (a === 'refaire') return aller(1);
  if (a === 'suiv') {
    if (ecrans()[pos] === 'profil') {
      ['nom', 'email', 'entreprise', 'fonction'].forEach(k => st.profil[k] = document.getElementById(k).value.trim());
      if (Object.values(st.profil).some(v => !v) || Object.keys(st.profil).length < 4) { err.textContent = 'Merci de remplir les quatre champs.'; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.profil.email)) { err.textContent = "L'adresse email semble incomplète."; return; }
    }
    return suiv();
  }
  const card = (k, v) => { app.querySelectorAll(`[data-${k}]`).forEach(c => c.classList.toggle('sel', c === b)); go.disabled = false; };
  if (b.dataset.taille) { st.taille = b.dataset.taille; card('taille'); return setTimeout(suiv, 380); }
  if (b.dataset.secteur) { st.secteur = b.dataset.secteur; card('secteur'); return setTimeout(suiv, 380); }
  if (b.dataset.obj) { st.objectif = b.dataset.obj; card('obj'); return; }
  if (b.dataset.dept) { const id = b.dataset.dept, i = st.depts.indexOf(id); i < 0 ? st.depts.push(id) : st.depts.splice(i, 1); b.classList.toggle('sel', i < 0); go.disabled = !st.depts.length; return; }
  if (b.dataset.tache) { const id = b.dataset.tache, box = b.closest('.task'); if (id in st.taches) delete st.taches[id]; else st.taches[id] = 0; box.classList.toggle('sel', id in st.taches); box.querySelectorAll('.hb').forEach(h => h.classList.remove('on')); go.disabled = !okTaches(parId[id].d.id); return; }
  if (b.dataset.h) { const id = b.dataset.tt; st.taches[id] = +b.dataset.h; b.parentNode.querySelectorAll('.hb').forEach(h => h.classList.toggle('on', h === b)); go.disabled = !okTaches(parId[id].d.id); return; }
  if (b.dataset.outil) { const l = st.outils[b.dataset.d] = st.outils[b.dataset.d] || [], o = b.dataset.outil, i = l.indexOf(o); i < 0 ? l.push(o) : l.splice(i, 1); b.classList.toggle('on', i < 0); return; }
  if (b.dataset.q) { st.mat[b.dataset.q] = +b.dataset.v; b.parentNode.querySelectorAll('.sc').forEach(s => s.classList.toggle('on', s === b)); go.disabled = Object.keys(st.mat).length !== D.maturite.length; return; }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') document.getElementById('go').click(); });
aller(0);
})();
</script>
</body>
</html>
